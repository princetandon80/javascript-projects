<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="github.css">
    <script src="github.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Hub Profile Finder</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <i class="fab fa-github"></i> Github User Finder
            </h1>
            <p>Search for any Github User</p>
        </header>
        <div class="search_container">
            <input type="text" id="search" placeholder="Enter any Username" autocomplete="off" />
            <button id="search_btn">Search</button>
        </div>
        <!-- // class will be hidden -->
        <div id="profile_container" class="hidden">
    <div class="profile_sub_container">
        <img src="" alt="Profile Avatar"  id="avatar"/>
        <div class="profile_info">
            <h2 id="name"></h2>
            <p id="username">honey</p>
            <p id="bio">hey</p>
            <div class="location_date">
            <p><i class="fas fa-map-marker-alt"></i>
            <span id="location">Not specified</span>
            </p>
            <p>
                <i class="far fa-calendar-alt"></i>
                joined
                <span id="joined-date"></span>
            </p>
</div>
<a  id="profile-link"  target="_blank" class="btn">
    View Profile
</a>
        </div>
    </div>
    <div class="stats">
        <div class="stat">
            <i class="fas fa-users"></i>
            <span id="followers"></span>follower
        </div>
        <div class="stat">
             <i class="fas fa-user-friends"></i>
            <span id="following"></span>following
        </div>
        <div class="stat">
             <i class="fas fa-code-branch"></i>
            <span id="repos"></span>repositories
        </div>
    </div>
    <div class="additional">
            <div class="add_info" id="company_contain">
                <i class="fas fa-building"></i>
                <span id="company">Not specified</span>
            </div>
        
        <div class="add_info" id="chain_contain">
            <i class="fas fa-link"></i>
            <a id="blog" target="_blank">No website</a>
        </div>
        <div class="add_info" id="twitter">
            <i class="fab fa-twitter"></i>
            <a id="twitter" target="_blank">No twitter</a>
        </div>
    </div>
    <div class="repos">
        <h3>Latest Repositories</h3>
        <div id="repos-container" class="repos-container">
            <!-- repo will be inserted here -->
             <div class="loading_repo">Loading Repositories</div>
            
        </div>
    </div>
    </div>
    <div class="error_container hidden">
        <p>No User Found</p>
    </div>
    
    </div>
    
</body>
</html>
